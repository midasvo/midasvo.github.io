# Projects shown on /projects/.
# Each item:
#   name:        string (display name)
#   tagline:     string (one-line description)
#   year:        string or number
#   image:       site-relative path to a thumbnail
#   image_width:  integer, pixel width of the thumbnail (optional, prevents layout shift)
#   image_height: integer, pixel height of the thumbnail (optional)
#   image_alt:   alt text for the thumbnail
#   url:         live site (optional)
#   post_url:    site-relative path to a blog write-up (optional)
#   tech:        array of strings (optional)

